[workspace]
members = ["crates/oauth-compat-core", "crates/oauth-compat-wasm", "crates/protocol", "crates/policy", "crates/agent-platform", "crates/readonly", "crates/writer", "crates/operation-core", "crates/operation-wasm", "crates/terminal-runner", "crates/relay-device-core", "crates/relay-device-wasm", "crates/terminal-store", "crates/agent-lifecycle-core", "crates/agent-lifecycle-wasm", "crates/relay-registry-core", "crates/relay-registry-wasm", "crates/js-value-compat", "crates/js-value-compat-fixture", "crates/native-store", "crates/native-store-fixture", "crates/agent-transport", "crates/agent-transport-fixture", "crates/agent-controller", "crates/agent-controller-fixture", "crates/native-agent", "crates/oidc-decision-core", "crates/oidc-decision-wasm", "crates/oidc-token-core", "crates/oidc-token-wasm"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
hex = "=0.4.3"
chat2local-protocol = { path = "crates/protocol" }
chat2local-policy = { path = "crates/policy" }
chat2local-agent-platform = { path = "crates/agent-platform" }
