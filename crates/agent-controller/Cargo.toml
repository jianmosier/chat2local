[package]
name = "chat2local-agent-controller"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
fixture = ["chat2local-agent-transport/fixture"]

[dependencies]
chat2local-agent-transport = { path = "../agent-transport" }
chat2local-protocol.workspace = true
chat2local-policy.workspace = true
chat2local-operation-core = { path = "../operation-core" }
serde.workspace = true
url = "=2.5.8"
chat2local-agent-platform.workspace = true
chat2local-native-store = { path = "../native-store" }
chat2local-js-value-compat = { path = "../js-value-compat" }
chat2local-agent-lifecycle-core = { path = "../agent-lifecycle-core" }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
openssl = "=0.10.81"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "sync"] }
hyper = { version = "=1.10.1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
