[package]
name = "chat2local-agent-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
fixture = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
hyper = { version = "=1.10.1", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
openssl = "=0.10.81"
openssl-sys = "=0.9.117"
foreign-types = "=0.3.2"
tokio-openssl = "=0.6.5"
url = "=2.5.8"
base64 = "=0.22.1"
