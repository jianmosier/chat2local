[package]
name = "chat2local-worker-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "=0.8.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
serde-wasm-bindgen = "=0.6.5"

[profile.release]
opt-level = "s"
lto = true
