<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>chat2local · 连接文件夹</title><link rel="stylesheet" href="/connect.css"><script type="module" src="/account-connect.js"></script></head><body><main><header><strong>chat2local</strong><span>连接同一个插件</span></header><section><h1>连接所选文件夹</h1><p id="account-status" role="status" aria-live="polite">正在继续原连接…</p><input id="account-nonce" type="hidden" value="{{NONCE}}"><dl id="account-summary" hidden><dt>账号</dt><dd id="account-name"></dd><dt>应用</dt><dd id="account-client"></dd><dt>电脑</dt><dd id="account-device"></dd><dt>文件夹</dt><dd id="account-folder"></dd></dl><button id="account-choose" disabled>选择文件夹</button><p id="account-permission" hidden></p><button id="account-confirm" hidden>允许读写并连接</button><p id="account-note" class="muted">只开放你选择的目录。确认后由程序完成连接，不需要配对码或重复确认。</p><details><summary>连接详情</summary><p id="account-callback" class="muted"></p><p class="muted">文件内容会经过 chat2local 连接服务和 AI 平台。登录验证与平台自身的确认不由本程序跳过。</p></details></section><p class="footnote">不会更改其他电脑、旧目录或系统网络设置。</p></main></body></html>
